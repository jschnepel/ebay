# The whole stack. ./run.sh creates deploy/.env on the first run and starts it with one command.
# Infrastructure images are pinned by digest (resolved 2026-11-16 via docker pull).
# Ports bind to 127.0.0.1 only; nothing infrastructure-level is exposed publicly.
name: auction

services:
  postgres:
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auction}
      POSTGRES_USER: ${POSTGRES_USER:-auction_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # Read once by the bootstrap script, when the data volume is first initialised.
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?set MIGRATOR_DB_PASSWORD in deploy/.env}
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:?set ENGINE_DB_PASSWORD in deploy/.env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD in deploy/.env}
      VERIFIER_DB_PASSWORD: ${VERIFIER_DB_PASSWORD:?set VERIFIER_DB_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      # Over TCP: during first-start initialisation the socket answers before TCP clients are accepted.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # One-shot: applies pending migrations as the schema-owning role, then exits 0.
  migrator:
    build:
      context: ..
      dockerfile: src/Auction.Migrator/Dockerfile
    environment:
      MIGRATOR_CONNECTION_STRING: Host=postgres;Database=${POSTGRES_DB:-auction};Username=migrator;Password=${MIGRATOR_DB_PASSWORD};GSS Encryption Mode=Disable
      # The demo accounts and auctions, added once to an empty database; the passwords come only from here.
      SEED_DEMO: ${SEED_DEMO:-true}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The auction engine: the only writer of auction state. gRPC on the internal network only (no published
  # port); the API is its only caller.
  engine:
    build:
      context: ..
      dockerfile: src/Auction.Engine/Dockerfile
    environment:
      ConnectionStrings__Engine: Host=postgres;Database=${POSTGRES_DB:-auction};Username=engine;Password=${ENGINE_DB_PASSWORD};Maximum Pool Size=${ENGINE_DB_POOL_SIZE:-50};GSS Encryption Mode=Disable
      Engine__LockTimeout: ${ENGINE_LOCK_TIMEOUT:-00:00:02}
      Engine__Limits__MinDuration: ${AUCTION_MIN_DURATION:-00:01:00}
      Engine__Limits__AmountCapCents: ${AUCTION_AMOUNT_CAP_CENTS:-1000000000}
      Engine__CloseWorkerEnabled: ${ENGINE_CLOSE_WORKER_ENABLED:-true}
      Engine__KeyRetention: ${ENGINE_KEY_RETENTION:-1.00:00:00}
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "Auction.Engine.dll", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  # The public HTTP API and the browser client it serves: accounts, auction reads (as the read-only api
  # role) and commands forwarded to the engine. The only application port published, bound to 127.0.0.1
  # for the reverse proxy in front of it.
  api:
    build:
      context: ..
      dockerfile: src/Auction.Api/Dockerfile
    environment:
      ConnectionStrings__Api: Host=postgres;Database=${POSTGRES_DB:-auction};Username=api;Password=${API_DB_PASSWORD};GSS Encryption Mode=Disable
      Api__EngineAddress: http://engine:8080
      Api__DemoMode: ${DEMO_MODE:-true}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Auction.Api.dll", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  redis:
    image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

volumes:
  pgdata:
