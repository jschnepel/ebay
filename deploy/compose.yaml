# The whole stack. ./run.sh creates deploy/.env on the first run and starts it with one command.
# Infrastructure images are pinned by digest (resolved 2026-11-16 via docker pull).
# Ports bind to 127.0.0.1 only; nothing infrastructure-level is exposed publicly.
name: auction

services:
  postgres:
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auction}
      POSTGRES_USER: ${POSTGRES_USER:-auction_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # Read once by the bootstrap script, when the data volume is first initialised.
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?set MIGRATOR_DB_PASSWORD in deploy/.env}
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:?set ENGINE_DB_PASSWORD in deploy/.env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD in deploy/.env}
      VERIFIER_DB_PASSWORD: ${VERIFIER_DB_PASSWORD:?set VERIFIER_DB_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      # Over TCP: during first-start initialisation the socket answers before TCP clients are accepted.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Comes back with Docker after a reboot; the API and engine wait for nothing else.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # One-shot: applies pending migrations as the schema-owning role, then exits 0.
  migrator:
    build:
      context: ..
      dockerfile: src/Auction.Migrator/Dockerfile
    environment:
      MIGRATOR_CONNECTION_STRING: Host=postgres;Database=${POSTGRES_DB:-auction};Username=migrator;Password=${MIGRATOR_DB_PASSWORD};GSS Encryption Mode=Disable
      # The demo accounts and auctions, added once to an empty database; the passwords come only from here.
      SEED_DEMO: ${SEED_DEMO:-true}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SIMULATOR_PASSWORD: ${SIMULATOR_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The auction engine: the only writer of auction state. gRPC on the internal network only (no published
  # port); the API is its only caller.
  engine:
    build:
      context: ..
      dockerfile: src/Auction.Engine/Dockerfile
    environment:
      ConnectionStrings__Engine: Host=postgres;Database=${POSTGRES_DB:-auction};Username=engine;Password=${ENGINE_DB_PASSWORD};Maximum Pool Size=${ENGINE_DB_POOL_SIZE:-50};GSS Encryption Mode=Disable
      Engine__LockTimeout: ${ENGINE_LOCK_TIMEOUT:-00:00:02}
      Engine__Limits__MinDuration: ${AUCTION_MIN_DURATION:-00:01:00}
      Engine__Limits__AmountCapCents: ${AUCTION_AMOUNT_CAP_CENTS:-1000000000}
      Engine__CloseWorkerEnabled: ${ENGINE_CLOSE_WORKER_ENABLED:-true}
      Engine__KeyRetention: ${ENGINE_KEY_RETENTION:-1.00:00:00}
      # OBS-01: traces, metrics and logs over OTLP; empty (the default) exports nothing.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "Auction.Engine.dll", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  # The public HTTP API and the browser client it serves: accounts, auction reads (as the read-only api
  # role) and commands forwarded to the engine. The only application port published, bound to 127.0.0.1
  # for the reverse proxy in front of it.
  api:
    build:
      context: ..
      dockerfile: src/Auction.Api/Dockerfile
    environment:
      ConnectionStrings__Api: Host=postgres;Database=${POSTGRES_DB:-auction};Username=api;Password=${API_DB_PASSWORD};GSS Encryption Mode=Disable
      Api__EngineAddress: http://engine:8080
      # The SignalR backplane (and, later, caches and rate limits). The API starts and bids work without it.
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Api__DemoMode: ${DEMO_MODE:-true}
      # When the demo-clock resets the demo each day (UTC); the admin area shows the next one.
      Api__DemoResetAtUtc: ${DEMO_RESET_AT_UTC:-09:00}
      # Behind the portfolio site's reverse proxy: the path it serves the app under, and the proxy's address.
      Api__PathBase: ${PATH_BASE:-}
      Api__TrustedProxies: ${TRUSTED_PROXIES:-}
      # The simulator's control endpoint, for starting and stopping runs from the admin area (ADM-02).
      Api__SimulatorAddress: http://simulator-control:8080
      Api__SimulatorToken: ${SIMULATOR_CONTROL_TOKEN:?set SIMULATOR_CONTROL_TOKEN in deploy/.env}
      # The key ring behind the session cookie, on a volume, so a rebuilt or recreated API keeps everyone signed in.
      Api__KeysDirectory: /var/lib/auction/keys
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - api-keys:/var/lib/auction/keys
    depends_on:
      engine:
        condition: service_healthy
      # Started first, but not required to be healthy: the API runs without Redis.
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "dotnet", "Auction.Api.dll", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  # The load simulator, on demand only (the "tools" profile keeps it out of `up`):
  #   docker compose -f deploy/compose.yaml run --rm simulator run realistic
  # It uses the public API like a browser and then checks every invariant as the read-only verifier role.
  simulator:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: src/Auction.Simulator/Dockerfile
    environment:
      BASE_URL: http://api:8080
      SIMULATOR_PASSWORD: ${SIMULATOR_PASSWORD:?set SIMULATOR_PASSWORD in deploy/.env}
      VERIFIER_CONNECTION_STRING: Host=postgres;Database=${POSTGRES_DB:-auction};Username=verifier;Password=${VERIFIER_DB_PASSWORD};GSS Encryption Mode=Disable
    volumes:
      - simulator-lock:/tmp
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  # The simulator's control endpoint for the admin area (ADM-02): the API starts and stops one bounded run
  # at a time with the shared token. Internal network only (no published port). It shares the CLI's run
  # lock through the simulator-lock volume, so a CLI run and an admin run never overlap.
  simulator-control:
    build:
      context: ..
      dockerfile: src/Auction.Simulator/Dockerfile
    command: ["serve"]
    environment:
      BASE_URL: http://api:8080
      SIMULATOR_PASSWORD: ${SIMULATOR_PASSWORD:-}
      SIMULATOR_CONTROL_TOKEN: ${SIMULATOR_CONTROL_TOKEN:?set SIMULATOR_CONTROL_TOKEN in deploy/.env}
      # The always-on live marketplace (listings with photos, simulated sellers and bidders) runs in the demo.
      LIVE_SIMULATION: ${DEMO_MODE:-true}
      VERIFIER_CONNECTION_STRING: Host=postgres;Database=${POSTGRES_DB:-auction};Username=verifier;Password=${VERIFIER_DB_PASSWORD};GSS Encryption Mode=Disable
    volumes:
      - simulator-lock:/tmp
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Auction.Simulator.dll", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m

  # The demo's reset (ADM-04): reset-demo every day at DEMO_RESET_AT_UTC and whenever an admin asks from the
  # Admin area, then a clear of Redis so nobody stays signed in on a removed session. It connects as the
  # schema owner, like the migrator, and has no port. Outside DEMO_MODE it does nothing.
  demo-clock:
    build:
      context: ..
      dockerfile: src/Auction.Migrator/Dockerfile
    command: ["demo-clock"]
    environment:
      MIGRATOR_CONNECTION_STRING: Host=postgres;Database=${POSTGRES_DB:-auction};Username=migrator;Password=${MIGRATOR_DB_PASSWORD};GSS Encryption Mode=Disable
      REDIS_CONNECTION: redis:6379,abortConnect=false
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_RESET_AT_UTC: ${DEMO_RESET_AT_UTC:-09:00}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SIMULATOR_PASSWORD: ${SIMULATOR_PASSWORD:-}
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "Auction.Migrator.dll", "demo-clock-health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # Optional developer tool (OBS-01), off unless the "observability" profile is on: the standalone Aspire
  # dashboard receives the API's and engine's traces, metrics and logs over OTLP. It is never the source of
  # the admin KPIs. Start it with the endpoint set, then open http://localhost:18888:
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889 docker compose -f deploy/compose.yaml --profile observability up -d
  aspire-dashboard:
    profiles: ["observability"]
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5@sha256:e2b7cf9a4ead932de46c6fa2a289c7d6159cfcf06a51aa65f38253a8fae75407
    environment:
      # No sign-in: the UI is bound to 127.0.0.1 for the operator, and OTLP is reachable only on the internal network.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-18888}:18888"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  redis:
    image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

volumes:
  pgdata:
  # The API's data-protection key ring (session cookies, antiforgery tokens). Not encrypted at rest: it lives
  # on the Docker host, which is trusted with the database volume already.
  api-keys:
  # The simulator's temporary directory, shared by the CLI and the control service so they share its run lock.
  simulator-lock:
