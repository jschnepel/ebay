name: Ordered browser walkthrough
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: walkthrough-${{ github.ref }}
  cancel-in-progress: true
jobs:
  walkthrough:
    if: github.head_ref == 'test/review-browser' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The hosted origin requires an approved runner. Disposable checks always run.
        target: ${{ fromJSON(vars.AUCTION_RUN_HOSTED_QA == 'true' && '["disposable","hosted"]' || '["disposable"]') }}
    name: Role checks (${{ matrix.target }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select target
        shell: bash
        run: |
          printf 'ROLE_BROWSER_MODULES=%s/role-browser\nROLE_RESULTS=%s/role-results\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          if [[ '${{ matrix.target }}' == 'hosted' ]]; then
            echo 'AUCTION_BASE_URL=https://auction.schnepel.cloud/' >> "$GITHUB_ENV"
          else
            echo 'AUCTION_BASE_URL=http://127.0.0.1:8080/' >> "$GITHUB_ENV"
          fi
      - name: Start disposable stack and check startup output
        if: matrix.target == 'disposable'
        shell: bash
        run: |
          umask 077
          if ! ./run.sh > "$RUNNER_TEMP/auction-startup.log" 2>&1; then
            grep -E 'error (CS|RZ|NU|MSB|NETSDK)[0-9]+|container .*unhealthy|service .*failed|failed to solve' "$RUNNER_TEMP/auction-startup.log" | head -20 || true
            exit 1
          fi
          while read -r email password; do
            test -n "$password"
            if grep -Fq -- "$password" "$RUNNER_TEMP/auction-startup.log"; then
              echo 'A demo credential appeared in startup output.'
              exit 1
            fi
          done < deploy/.demo-credentials
          read -r email password < deploy/.demo-credentials
          echo "::add-mask::$password"
          printf 'QA_ADMIN_EMAIL=%s\nQA_ADMIN_PASSWORD=%s\n' "$email" "$password" >> "$GITHUB_ENV"
      - name: Install Chromium
        shell: bash
        run: |
          npm install --prefix "$ROLE_BROWSER_MODULES" --ignore-scripts --no-audit --no-fund @playwright/test@1.64.1
          "$ROLE_BROWSER_MODULES/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run buyer, seller and admin checks
        run: node tests/walkthrough/roles.cjs
      - name: Save step results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: role-walkthrough-${{ matrix.target }}
          path: ${{ runner.temp }}/role-results
          retention-days: 7
  focused:
    name: Unit tests and startup credentials
    if: github.head_ref == 'test/review-browser' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Exercise first and repeated startup without starting containers
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root=$(mktemp -d)
          mkdir -p "$root/deploy" "$root/bin"
          cp run.sh "$root/"
          cp deploy/.env.example deploy/prepare-engine-tls.sh "$root/deploy/"
          printf '#!/bin/sh\nexit 0\n' > "$root/bin/docker"
          chmod 700 "$root/bin/docker"
          cd "$root"
          PATH="$root/bin:$PATH" ./run.sh > first.log 2>&1
          test "$(wc -l < deploy/.demo-credentials)" -eq 3
          test "$(stat -c %a deploy/.demo-credentials)" = 600
          cp deploy/.demo-credentials first-credentials
          PATH="$root/bin:$PATH" ./run.sh > repeat.log 2>&1
          cmp -s first-credentials deploy/.demo-credentials
          while read -r email password; do
            test -n "$password"
            if grep -Fq -- "$password" first.log repeat.log; then
              echo "A generated credential was printed."
              exit 1
            fi
          done < deploy/.demo-credentials
          grep -Fq 'deploy/.demo-credentials' first.log
      - name: Run the domain and client unit tests
        shell: bash
        run: |
          dotnet restore tests/Auction.UnitTests --locked-mode
          dotnet test --project tests/Auction.UnitTests --no-restore -c Release --report-trx --results-directory "$RUNNER_TEMP/unit-results"
  photos:
    name: Listing photo API and browser tests
    if: github.head_ref == 'test/review-browser' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Build the photo tests
        run: |
          dotnet restore tests/Auction.IntegrationTests --locked-mode
          dotnet build tests/Auction.IntegrationTests --no-restore -c Release
          pwsh tests/Auction.IntegrationTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Test the upload API and seller photo controls
        run: dotnet test --project tests/Auction.IntegrationTests --no-build -c Release --report-trx --results-directory "$RUNNER_TEMP/photo-results" -- --filter-class '*Image*'
      - name: Record individual outcomes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os
          from xml.etree import ElementTree
          files = glob.glob(os.environ['RUNNER_TEMP']+'/photo-results/**/*.trx',recursive=True)
          results = [case for path in files for case in ElementTree.parse(path).findall('.//{*}UnitTestResult')]
          for case in results:
              print(case.get('outcome'),case.get('testName'))
          if not results or any(case.get('outcome') != 'Passed' for case in results):
              raise SystemExit(1)
          PY
