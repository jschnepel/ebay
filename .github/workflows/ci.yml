name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions pinned by commit SHA (resolved 2026-11-16).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: No floating-point money
        shell: bash
        run: |
          # Money is long cents: no float/double in src, and decimal only on lines marked display-only.
          code() { grep -rnE "$1" --include='*.cs' src/ | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true; }
          hits=$(code '\b(float|double)\b')
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::float/double found in src/"; exit 1; fi
          hits=$(code '\bdecimal\b|\b[0-9]+m\b' | grep -v 'display-only' || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::decimal outside a display-only line in src/"; exit 1; fi
          echo "No floating-point money in src/"

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release

      - name: Chromium for the browser tests
        run: pwsh tests/Auction.IntegrationTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # The README's one command on this fresh clone: generates deploy/.env, builds and starts the stack.
      - name: One command (./run.sh)
        run: ./run.sh

      - name: Test (Microsoft.Testing.Platform; Testcontainers uses the runner's Docker)
        run: dotnet test --no-build -c Release --report-trx --results-directory "$GITHUB_WORKSPACE/TestResults" --coverage --coverage-output-format cobertura

      - name: Browser journey against the one-command stack
        env:
          AUCTION_BASE_URL: http://localhost:8080
        run: dotnet test --no-build -c Release --project tests/Auction.IntegrationTests --report-trx --results-directory "$GITHUB_WORKSPACE/TestResults/stack" -- --filter-class "*JourneyTests"

      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color --tail 200

      - name: Fail on zero discovered tests
        shell: bash
        run: |
          total=$(grep -ho 'total="[0-9]*"' TestResults/*.trx | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "Discovered tests: $total"
          if [ "$total" -eq 0 ]; then echo "::error::Zero tests discovered"; exit 1; fi

      - name: Domain line coverage of at least 80%
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          rates = [float(p.get("line-rate")) for f in glob.glob("TestResults/*.cobertura.xml")
                   for p in ET.parse(f).getroot().iter("package") if p.get("name") == "Auction.Domain"]
          best = max(rates, default=0.0)
          print(f"Auction.Domain line coverage: {best:.1%}")
          raise SystemExit(0 if best >= 0.80 else 1)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          retention-days: 14

  # The engine's gRPC contract: lint and format always; on pull requests, no breaking changes against the base.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          input: src/Auction.Contracts
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=src/Auction.Contracts
          push: false
          archive: false
          pr_comment: false

  # Final aggregator: fails on any non-success (failure, skipped, cancelled) of required jobs.
  gate:
    if: always()
    needs: [build-test, contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to succeed
        shell: bash
        run: |
          for result in "${{ needs.build-test.result }}" "${{ needs.contracts.result }}"; do
            echo "job result: $result"
            if [ "$result" != "success" ]; then exit 1; fi
          done
